  <line x1="75" y1="95" x2="125" y2="95" stroke="#4A6FA5" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 装饰线条2 -->
  <line x1="75" y1="115" x2="110" y2="115" stroke="#4A6FA5" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 装饰线条3 -->
